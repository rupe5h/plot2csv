[package]
name = "plot2csv-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "plot2csv"
path = "src/main.rs"

[features]
default = []
native-ocr = ["plot2csv-ocr/native-ocr"]

[dependencies]
plot2csv-core.workspace = true
plot2csv-vision.workspace = true
plot2csv-ocr.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37"
egui_plot = "0.38"
image.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
log.workspace = true
anyhow.workspace = true
rfd = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "HtmlElement", "Element", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlInputElement", "FileList", "File", "FileReader", "ClipboardEvent", "DataTransfer", "DataTransferItemList", "DataTransferItem", "Event", "EventTarget", "Storage", "console"] }
console_error_panic_hook = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
pollster = "0.4"
